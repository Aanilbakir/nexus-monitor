name: Bug report
description: Report a reproducible problem in NEXUS Monitor.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve NEXUS Monitor. Do not include secrets or sensitive host data.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, pnpm version, and relevant deployment details.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials, IP addresses, hostnames, and personal data.
