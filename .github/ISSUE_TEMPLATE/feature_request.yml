name: Feature request
description: Propose a focused improvement to NEXUS Monitor.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the monitoring problem this change would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the user-visible result, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: boundary
    attributes:
      label: Primary system boundary
      options:
        - Agent
        - API
        - Persistence
        - Realtime transport
        - Dashboard
        - Alerting
        - Documentation or tooling
    validations:
      required: true
