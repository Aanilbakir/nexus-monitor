name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://nexus:ci-only@127.0.0.1:5432/nexus_monitor
        run: pnpm prisma:generate
      - name: Build shared packages
        run: pnpm --filter @nexus-monitor/contracts build && pnpm --filter @nexus-monitor/database build
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://nexus:ci-only@127.0.0.1:5432/nexus_monitor
        run: pnpm prisma:validate
